schema: spec-driven

# Project context (recommended)
# This is injected into every artifact generation — proposals, designs, and tasks
# will all be grounded in your actual stack and conventions.
# Fill this in when setting up the project for much better AI-generated artifacts.
#
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js, Prisma
#     We use conventional commits and trunk-based development
#     Domain: e-commerce platform with multi-tenant architecture
#     Key conventions: All API routes under /api/v1, Zod for validation,
#     TanStack Query for data fetching, next-intl for i18n

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
#       - Each task must have clear acceptance criteria

# Per-task models (optional, opt-in)
# Which model each Coograph agent runs on. `unset` means Coograph asks once, on
# the next ticket, and never again whatever you answer. `off` means every agent
# inherits your session model and nothing is suggested. `preset` applies the map
# below. `per-task` suggests a map for each ticket before using it.
#   /coograph-suggest-multi-models   propose or change a mapping
#   /coograph-disable-multi-models   turn it off for good
models:
  mode: unset          # unset | off | preset | per-task
  # preset:            # aliases: fable | opus | sonnet | haiku
  #   explore: haiku
  #   search: haiku
  #   verifier: sonnet
  #   reviewer: opus
  #   debugger: opus
  #   planner: opus
  #   retro: opus
