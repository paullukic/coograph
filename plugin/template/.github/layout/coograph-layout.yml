# coograph:managed (sync refreshes this file while this line is here; delete the line to keep local edits)
# Coograph instruction layout: budgets per tier, and docs that keep up with code.
# Copied to .github/workflows/ by /coograph-init when you opt in.
# Config: .github/layout/layout.json.
# Skip the guard for one PR by putting the skip marker (default "[skip docs]")
# in the PR title; `edited` below re-runs the check when the title changes.
name: coograph-layout

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  layout:
    runs-on: ubuntu-latest
    # The checker may be downloaded from coograph `main` (below): give the job
    # nothing it could misuse.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Projects that keep coograph tooling out of git (a global excludesfile)
      # have no committed checker; fetch it. With no committed layout.json the
      # built-in defaults apply.
      - name: Fetch the checker when it is not committed
        run: |
          if [ ! -f .github/layout/layout.py ]; then
            mkdir -p .github/layout
            curl -fsSL https://raw.githubusercontent.com/paullukic/coograph/main/.github/layout/layout.py \
              -o .github/layout/layout.py
            sha256sum .github/layout/layout.py
          fi
      - name: Instruction budget
        run: python .github/layout/layout.py --budget
      - name: Docs guard
        env:
          # Passed through env, never interpolated into the script.
          COOGRAPH_PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: python .github/layout/layout.py --guard "origin/$BASE_REF" HEAD
